name: Weekly AI News Digest

on:
  schedule:
    # Jeden Montag um 05:00 UTC (06:00 CET im Winter / 07:00 CEST im Sommer)
    - cron: '0 5 * * 1'
  workflow_dispatch:  # Manuelles Triggern möglich

permissions:
  issues: write

jobs:
  curate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Single Source of Truth für den Modell-Alias - wird sowohl vom
      # Pre-Flight-Check als auch vom eigentlichen Run gelesen, damit beide
      # nicht auseinanderlaufen können (vorher 4x hardcoded dupliziert).
      GATEWAY_MODEL: news-curator/classify

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: |
          # Gleicher Weg (pyproject.toml + uv.lock) wie tests.yml - vorher
          # lief dieser Job auf `pip install -r requirements.txt` mit Python
          # 3.11, während die Tests gegen pyproject.toml/uv.lock mit Python
          # 3.13 liefen: ein grüner Testlauf hätte die tatsächliche
          # Produktionsumgebung nicht validiert. --locked bricht statt einer
          # stillen Neu-Auflösung, falls pyproject.toml/uv.lock auseinanderlaufen.
          uv sync --locked

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Open tunnel to private LLM-Gateway
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Das Gateway ist privat (Fly 6PN/IPv6) und vom öffentlichen GH-Runner
          # nur über einen fly-proxy-Tunnel erreichbar.
          # stdout/stderr in eine Datei statt in die Step-Pipe, sonst kann der
          # Hintergrundprozess das Step-Teardown blockieren; bei Fehlschlag wird
          # die Datei unten ausgegeben, damit der WireGuard-Fehler sichtbar bleibt.
          fly proxy 4000:4000 -a tf-llm-gateway > fly-proxy.log 2>&1 &
          # Warten bis der Tunnel steht (LiteLLM /health/liveliness, ohne Auth).
          # 60s statt 30s: WireGuard-Peer-Aufbau auf einem frischen Runner kann
          # knapp über der alten Grenze liegen.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4000/health/liveliness; then
              echo "✓ Gateway-Tunnel bereit"; exit 0
            fi
            sleep 1
          done
          echo "✗ Gateway-Tunnel kam nicht hoch"
          cat fly-proxy.log
          exit 1

      - name: Verify gateway key and model alias
        env:
          GATEWAY_KEY: ${{ secrets.NEWS_CURATOR_GATEWAY_KEY }}
        run: |
          # /health/liveliness beweist nur, dass der LiteLLM-Prozess antwortet -
          # NICHT dass der Virtual Key gültig ist oder der Alias $GATEWAY_MODEL
          # existiert. Das ist aber genau das, was ein Config-Edit am Gateway
          # (Modellwechsel, Key-Rotation) am ehesten kaputt macht. Ein
          # authentifizierter Pre-Flight-Call schlägt dafür in Sekunden fehl
          # statt erst nach bis zu 20 verschwendeten Item-Calls.
          test -n "$GATEWAY_KEY" || { echo "✗ NEWS_CURATOR_GATEWAY_KEY ist leer"; exit 1; }
          response=$(curl -s -o /tmp/models.json -w "%{http_code}" \
            -H "Authorization: Bearer $GATEWAY_KEY" \
            http://localhost:4000/v1/models)
          if [ "$response" = "000" ]; then
            # Verbindungsfehler (Tunnel-Blip) != ungültiger Key. Beides als
            # "Key ungültig" zu melden schickt die Fehlersuche in die falsche
            # Richtung (Key-Rotation statt Tunnel-Diagnose).
            echo "✗ Konnte Gateway nicht erreichen (curl-Verbindungsfehler, kein HTTP-Code)"
            exit 1
          fi
          if [ "$response" != "200" ]; then
            echo "✗ Gateway-Key ungültig (HTTP $response)"
            cat /tmp/models.json
            exit 1
          fi
          # jq statt grep: ein reiner Substring-Match würde auch bei einem
          # umbenannten Alias wie "$GATEWAY_MODEL-v2" fälschlich "verfügbar"
          # melden, wenn der alte Alias entfernt wurde - exakter id-Vergleich
          # fängt genau die Drift, die dieser Check abfangen soll.
          if ! jq -e --arg model "$GATEWAY_MODEL" \
               '.data[]? | select(.id == $model)' /tmp/models.json > /dev/null; then
            echo "✗ Alias '$GATEWAY_MODEL' ist für diesen Key nicht sichtbar"
            cat /tmp/models.json
            exit 1
          fi
          echo "✓ Gateway-Key gültig, Alias $GATEWAY_MODEL verfügbar"

      - name: Run AI News Curator
        env:
          GATEWAY_KEY: ${{ secrets.NEWS_CURATOR_GATEWAY_KEY }}
          GATEWAY_URL: http://localhost:4000
        run: |
          uv run python ai_news_curator.py

      - name: Create Issue with News Digest
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '');
            const filename = `ai_news_digest_${today}.md`;

            if (fs.existsSync(filename)) {
              const content = fs.readFileSync(filename, 'utf8');

              // ai_news_curator.py hängt einen <!-- digest-meta: ... --> Kommentar
              // mit echten Zahlen an. Wichtig: NICHT auf die '## 🔥 Sofort relevant'
              // Überschrift matchen - die steht immer im Report (auch wenn die
              // Liste leer ist, dann nur mit Platzhaltertext darunter), ein
              // content.includes() darauf wäre also immer true.
              const meta = content.match(
                /<!-- digest-meta: high_priority=(\d+) medium_priority=(\d+) gateway_errors=(\d+) -->/
              );
              if (!meta) {
                // Fehlender Marker darf NICHT lautlos zu "alles normal"
                // degradieren - das wäre genau der hasHighPriority-Bug von
                // vorher, nur in die andere Richtung (immer false statt
                // immer true). Denkbare Ursachen: alter gecachter Digest im
                // Repo, künftige Formatänderung am Marker.
                core.warning(
                  `digest-meta-Marker nicht in ${filename} gefunden - ` +
                  `Priority-Label und [DEGRADED]-Prefix können falsch sein.`
                );
              }
              const highPriorityCount = meta ? parseInt(meta[1], 10) : 0;
              const gatewayErrorCount = meta ? parseInt(meta[3], 10) : 0;
              const hasHighPriority = highPriorityCount > 0;
              // Unterhalb des Guard-Schwellwerts (30%) in ai_news_curator.py kann
              // ein Lauf noch mit Gateway-Fehlern durchlaufen - das soll im Issue
              // sofort sichtbar sein, nicht nur in der Kategorien-Statistik vergraben.
              const isDegraded = gatewayErrorCount > 0;
              const labels = hasHighPriority ? ['ai-news', 'high-priority'] : ['ai-news'];
              if (isDegraded) {
                labels.push('gateway-degraded');
              }
              const titlePrefix = isDegraded
                ? '⚠️ [DEGRADED]'
                : (hasHighPriority ? '🎯 Hochprioritäre' : '📰');

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titlePrefix} AI News - ${new Date().toISOString().split('T')[0]}`,
                body: content,
                labels: labels
              });

              // Lock issue to prevent spam comments (only collaborators can comment)
              await github.rest.issues.lock({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.data.number,
                lock_reason: 'spam'
              });

              console.log(`Created and locked issue #${issue.data.number}`);
            } else {
              console.log(`File ${filename} not found`);
            }
