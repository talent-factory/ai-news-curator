name: Daily AI News Digest

on:
  schedule:
    # Täglich um 05:00 UTC (06:00 CET im Winter / 07:00 CEST im Sommer)
    - cron: '0 5 * * *'
  workflow_dispatch:  # Manuelles Triggern möglich

permissions:
  issues: write

jobs:
  curate-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run AI News Curator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python ai_news_curator.py

      - name: Create Issue with News Digest
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '');
            const filename = `ai_news_digest_${today}.md`;

            if (fs.existsSync(filename)) {
              const content = fs.readFileSync(filename, 'utf8');

              // Determine priority based on content
              const hasHighPriority = content.includes('## 🔥 Sofort relevant');
              const labels = hasHighPriority ? ['ai-news', 'high-priority'] : ['ai-news'];
              const titlePrefix = hasHighPriority ? '🎯 Hochprioritäre' : '📰';

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titlePrefix} AI News - ${new Date().toISOString().split('T')[0]}`,
                body: content,
                labels: labels
              });
            } else {
              console.log(`File ${filename} not found`);
            }
