[project]
name = "ai-news-curator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "openai>=1.0.0",
    "dotenv>=0.9.9",
    "feedparser>=6.0.12",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
# test_sources.py ist ein manuelles Debug-Skript gegen live RSS/Reddit/GitHub-Quellen
# (siehe Docstring), keine echte Unit-Test-Suite - für CI ausgeschlossen (flaky/slow).
addopts = "--ignore=test_sources.py"
